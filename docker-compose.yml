# Facebook Giveaway Tool — headed collector runtime.
# n8n is a separate deployment and calls the collector over its configured
# external/private network address; the API contract is documented in docs/INTEGRATION.md.
name: giveaway-tool

services:
  browser:
    build:
      context: ./collector
      dockerfile: Dockerfile.browser
    image: giveaway-tool-browser:1.0.0
    container_name: giveaway-tool-browser
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 256m
    stop_grace_period: 30s
    expose:
      - "5679"
      - "5900"
      - "6080"
    volumes:
      - browser_profile:/profile
    environment:
      - COLLECTOR_BIND=${COLLECTOR_BIND:-0.0.0.0}
      - COLLECTOR_ALLOW_NON_LOOPBACK=${COLLECTOR_ALLOW_NON_LOOPBACK:-true}
      - COLLECTOR_PROFILE_DIR=${COLLECTOR_PROFILE_DIR:-/profile}
      - COLLECTOR_HEADLESS=${COLLECTOR_HEADLESS:-false}
      - CHROME_PATH=${CHROME_PATH:-/usr/bin/chromium}
      - PROFILE_DIR=${PROFILE_DIR:-/profile}
      - VNC_PASSWORD=${VNC_PASSWORD}
      - TZ=${TZ:-UTC}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5679/status').then(r=>{process.exit(r.ok||r.status===401?0:1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  browser_profile:
    name: giveaway-tool_browser_profile
